<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Operaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .automata-container {
            text-align: center;
            margin-top: 20px;
        }

        .automata {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .node {
            background-color: #007BFF;
            color: white;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .transition-arrow {
            font-size: 2rem;
            margin: 10px 0;
        }

        .back-button {
            margin-top: 30px;
            display: block;
            text-align: center;
            color: #007BFF;
            text-decoration: none;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Árbol de Operaciones</h1>

    <div class="automata-container">
        <div class="automata">
            {% for operation in history %}
                <div class="node">
                    {{ operation.expression }}
                </div>
                {% if not loop.last %}
                    <div class="transition-arrow">↓</div>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <a href="/" class="back-button">Volver a la Calculadora</a>
</body>
</html>
